# LYNX :: hypridle core config
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# LYNX-owned. Your ~/.config/hypr/hypridle.conf sources this file, then
# defines the timeouts, which are yours to choose.
#
# This file is only the wiring that has to be right for the lock to be
# trustworthy.

general {
    # What "lock the session" means: `loginctl lock-session`, before sleep, or
    # a timeout. `lx lock` does nothing if a lock screen is already up, so
    # repeated lock requests can't stack lock screens.
    lock_cmd = sh ~/dotfiles/lynx/bin/lx lock

    # Lock BEFORE the machine sleeps...
    before_sleep_cmd = loginctl lock-session

    # ...and hold the sleep until the lock screen has actually locked the
    # session (mode 3). Without this, sleep can win the race, and your unlocked
    # desktop is on screen for a moment when the machine wakes.
    inhibit_sleep = 3

    # Screens back on after waking.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
