# LYNX :: hyprpaper core config
# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
#
# LYNX-owned. Your ~/.config/hypr/hyprpaper.conf sources this file.
#
# Which wallpaper is showing is runtime state, not config. `lx wallpaper`
# points ~/.cache/lynx/wallpaper/current at the picture you chose, and tells the
# running hyprpaper to switch. This file only says "show whatever `current`
# points to", so the choice survives restarts and reboots.

# Hyprland's splash text drawn over the wallpaper.
splash = false

# `lx wallpaper set` switches the picture through this.
ipc = true

wallpaper {
    # Empty = every monitor.
    monitor =
    path = ~/.cache/lynx/wallpaper/current
    # cover = fill the screen, cropping edges if the aspect ratio differs.
    fit_mode = cover
}
