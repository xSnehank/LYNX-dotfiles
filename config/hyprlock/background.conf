# LYNX :: lock screen background
#
# Your current wallpaper, blurred and dimmed, on every monitor.
#
# Deliberately NOT `path = screenshot`: a screenshot captures whatever windows
# were open when the screen locked, and blur doesn't reliably hide large text.
# The wallpaper can't leak anything.
#
# lock.jpg is a copy of your wallpaper, resized once by `lx wallpaper set`.
# hyprlock never has to decode a full-size 8K PNG while locking, so the lock
# appears instantly whatever wallpaper you use. If it doesn't exist yet, the
# plain palette color shows instead (general:immediate_render, in core.conf).

background {
    monitor =
    path = $HOME/.cache/lynx/wallpaper/lock.jpg
    color = rgb($surface)

    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.2

    # When the wallpaper changes while locked, fade over instead of snapping.
    crossfade_time = 0.4
}
