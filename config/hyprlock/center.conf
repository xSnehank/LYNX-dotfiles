# LYNX :: lock screen center column
#
# Shown on EVERY monitor, so you can unlock from whichever screen you're facing.
#
#   hours
#   minutes         (accent color)
#   DAY • DATE
#   your picture
#   password field
#   fingerprint prompt / keyboard layout
#
# Positions: valign = center puts a widget's middle at the screen's middle, and
# `position` then shifts it. y is a percentage of the screen height, positive is
# up. That's what keeps the layout the same shape on any resolution.
#
# No shell "$(...)" anywhere in lock screen configs: hyprlock's config language
# treats "$(" as its own arithmetic syntax.

# ─── Clock ──────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] date +%H
    font_family = $lx_font
    font_size = 110
    color = rgb($on_surface)
    position = 0, 27%
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = cmd[update:1000] date +%M
    font_family = $lx_font
    font_size = 110
    color = rgb($primary)
    position = 0, 13%
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = cmd[update:60000] date '+%A • %-d %b' | tr '[:lower:]' '[:upper:]'
    font_family = $lx_font_text
    font_size = 18
    color = rgb($on_surface)
    position = 0, 3%
    halign = center
    valign = center
    shadow_passes = 2
}

# ─── You ────────────────────────────────────────────────────────────────────

image {
    monitor =
    path = $lx_avatar
    size = 110
    rounding = -1
    border_size = 3
    border_color = rgb($primary)
    position = 0, -8%
    halign = center
    valign = center
}

# ─── Password ───────────────────────────────────────────────────────────────
# The outline changes color to say what's happening:
#   accent = checking   ·   error color = wrong password   ·   yellow = Caps Lock on

input-field {
    monitor =
    size = 18%, 5%
    rounding = 14
    outline_thickness = 2

    inner_color    = rgba($surface_container, 0.9)
    outer_color    = rgb($outline)
    check_color    = rgb($primary)
    fail_color     = rgb($error)
    capslock_color = rgb($tertiary)
    font_color     = rgb($on_surface)
    font_family    = $lx_font_text

    dots_size = 0.22
    dots_spacing = 0.3
    fade_on_empty = false

    placeholder_text = <span font_family="$lx_font">󰌾</span>   Password
    # $FAIL is the reason PAM gave. $ATTEMPTS counts failures. On Arch, 3
    # failures in a row lock the account for 10 minutes (pam_faillock), and
    # $FAIL is where that message appears.
    fail_text = $FAIL <b>($ATTEMPTS)</b>

    position = 0, -18%
    halign = center
    valign = center
}

# ─── Status lines ───────────────────────────────────────────────────────────

# Fingerprint prompt. Empty when fingerprint unlock isn't available.
label {
    monitor =
    text = $FPRINTPROMPT
    font_family = $lx_font_text
    font_size = 13
    color = rgb($on_surface_variant)
    position = 0, -24%
    halign = center
    valign = center
}

# Keyboard layout, but only when it isn't your first one ($LAYOUT[!] hides
# layout 0). If you type your password in the wrong layout, this tells you.
label {
    monitor =
    text = $LAYOUT[!]
    font_family = $lx_font_text
    font_size = 13
    color = rgb($tertiary)
    position = 0, -27%
    halign = center
    valign = center
}
