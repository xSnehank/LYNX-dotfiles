# LYNX :: lock screen behaviour
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    # Draw the background color the instant the lock starts, and the wallpaper
    # as soon as it has loaded. The lock never waits on an image file.
    immediate_render = true

    # Keep the cursor: the media buttons are clickable.
    hide_cursor = false

    # How long the "wrong password" state stays on screen, in ms.
    fail_timeout = 2000
}

auth {
    # Fingerprint runs in parallel with the password; either one unlocks.
    fingerprint:enabled = $lx_fingerprint
    fingerprint:ready_message = Scan your fingerprint to unlock
    fingerprint:present_message = Scanning…
}

# hyprlock can fade itself in and out, and animate the password field. It
# cannot move or morph widgets; see docs/lockscreen.md for what that means
# compared to Caelestia.
animations {
    enabled = true
    bezier = lxOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, lxOut
    animation = fadeOut, 1, 3, lxOut
    animation = inputFieldColors, 1, 3, lxOut
    animation = inputFieldDots, 1, 2, lxOut
}
