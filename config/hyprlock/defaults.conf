# LYNX :: lock screen defaults
#
# Every knob the lock screen has. Don't edit them here: set them in
# ~/.config/hypr/hyprlock.conf, in its "Your settings" section.
#
# Why that works: hyprlock reads its config top to bottom and swaps each
# $variable in as plain text the moment it reads a line. A value set after
# these defaults but before the layout is the one the layout sees.
#
# $HOME is an environment variable; hyprlock fills it in the same way.

# Where the LYNX repo lives. Used to run `lx` for the live panels.
$lx_lynx = $HOME/dotfiles/lynx

# Fonts. The mono font keeps the panels' columns lined up.
$lx_font      = JetBrainsMono Nerd Font
$lx_font_text = Noto Sans

# Your picture above the password field. A square image works best.
# If the file doesn't exist, the lock screen simply shows no picture.
$lx_avatar = $HOME/.face

# Fingerprint unlock via fprintd, alongside the password.
# Safe to leave on without a reader: hyprlock logs a warning and carries on.
$lx_fingerprint = true

# Weather location, e.g. Berlin or 52.52,13.40.
# Empty = wttr.in guesses from your IP address. Either way the request goes to
# wttr.in. Don't want that? Remove the weather panel from your hyprlock.conf.
$lx_weather_location =

# Which monitor gets the side panels. `lx lock` sets this to the focused
# monitor every time it locks (~/.cache/lynx/lock-session.conf).
# Empty = every monitor.
$lx_monitor =
