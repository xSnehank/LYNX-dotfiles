# LYNX :: fallback palette (hyprlock)
#
# The same color contract as the Waybar, rofi and swaync fallback palettes:
# same roles, same values. The repo check compares all four.
#
# Why a fourth format: hyprlock's config language swaps $variables in as plain
# text, and it has no color functions. Writing each role as a decimal
# "r, g, b" triple lets one variable give you both solid and see-through:
#
#     color = rgb($surface)          solid
#     color = rgba($surface, 0.8)    80% opaque
#
# Load order (see ~/.config/hypr/hyprlock.conf): this file first, then the
# generated palette in ~/.cache/lynx/colors-hyprlock.conf. A variable that's
# set again later replaces the earlier value.

$surface            = 30, 30, 46
$surface_container  = 49, 50, 68
$on_surface         = 205, 214, 244
$on_surface_variant = 166, 173, 200
$outline            = 69, 71, 90
$primary            = 137, 180, 250
$on_primary         = 30, 30, 46
$tertiary           = 249, 226, 175
$error              = 243, 139, 168
