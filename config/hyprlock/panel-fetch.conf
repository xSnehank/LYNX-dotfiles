# LYNX :: lock screen panel — system info (left column, middle)
#
# A small fetch-style card: OS, compositor, user, uptime, battery.
# Everything is read from local files; nothing touches the network.
#
# Remove this panel: comment out its `source =` line in ~/.config/hypr/hyprlock.conf

shape {
    monitor = $lx_monitor
    size = 22%, 20%
    color = rgba($surface, 0.72)
    rounding = 20
    border_size = 1
    border_color = rgba($outline, 0.8)
    position = 3%, 4%
    halign = left
    valign = center
}

label {
    monitor = $lx_monitor
    text = cmd[update:60000] sh $lx_lynx/bin/lx lock info fetch
    font_family = $lx_font
    font_size = 13
    text_align = left
    color = rgb($on_surface)
    position = 4.6%, 4%
    halign = left
    valign = center
    zindex = 1
}
