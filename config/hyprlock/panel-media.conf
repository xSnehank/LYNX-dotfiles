# LYNX :: lock screen panel — media (left column, bottom)
#
# What's playing, with previous / play-pause / next buttons you can click while
# locked. The buttons only control media players (via playerctl); they can't
# reach anything else in your session.
#
# Remove this panel: comment out its `source =` line in ~/.config/hypr/hyprlock.conf

shape {
    monitor = $lx_monitor
    size = 22%, 20%
    color = rgba($surface, 0.72)
    rounding = 20
    border_size = 1
    border_color = rgba($outline, 0.8)
    position = 3%, -20%
    halign = left
    valign = center
}

# Title and artist.
label {
    monitor = $lx_monitor
    text = cmd[update:2000] sh $lx_lynx/bin/lx lock info media
    font_family = $lx_font
    font_size = 13
    text_align = left
    color = rgb($on_surface)
    position = 4.6%, -16%
    halign = left
    valign = center
    zindex = 1
}

# ─── Buttons ────────────────────────────────────────────────────────────────

label {
    monitor = $lx_monitor
    text = 󰒮
    font_family = $lx_font
    font_size = 24
    color = rgb($on_surface)
    onclick = playerctl previous
    position = 5.5%, -25%
    halign = left
    valign = center
    zindex = 1
}

# Shows pause while something plays, play otherwise.
label {
    monitor = $lx_monitor
    text = cmd[update:1000] sh $lx_lynx/bin/lx lock info media-button
    font_family = $lx_font
    font_size = 24
    color = rgb($primary)
    onclick = playerctl play-pause
    position = 9.5%, -25%
    halign = left
    valign = center
    zindex = 1
}

label {
    monitor = $lx_monitor
    text = 󰒭
    font_family = $lx_font
    font_size = 24
    color = rgb($on_surface)
    onclick = playerctl next
    position = 13.5%, -25%
    halign = left
    valign = center
    zindex = 1
}
