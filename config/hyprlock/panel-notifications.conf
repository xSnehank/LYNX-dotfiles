# LYNX :: lock screen panel — notifications (right column, bottom)
#
# Only HOW MANY notifications are waiting, never what they say. A lock screen
# is visible to anyone near your desk, so message previews and app names stay
# behind the password.
#
# Remove this panel: comment out its `source =` line in ~/.config/hypr/hyprlock.conf

shape {
    monitor = $lx_monitor
    size = 22%, 14%
    color = rgba($surface, 0.72)
    rounding = 20
    border_size = 1
    border_color = rgba($outline, 0.8)
    position = -3%, -8%
    halign = right
    valign = center
}

label {
    monitor = $lx_monitor
    text = cmd[update:5000] sh $lx_lynx/bin/lx lock info notifications
    font_family = $lx_font
    font_size = 13
    text_align = left
    color = rgb($on_surface)
    position = -4.6%, -8%
    halign = right
    valign = center
    zindex = 1
}
