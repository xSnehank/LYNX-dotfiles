# LYNX :: lock screen panel — resources (right column, top)
#
# CPU load and temperature, memory, and root disk usage, as small bars.
# Read from /proc, /sys and df; nothing touches the network.
#
# Remove this panel: comment out its `source =` line in ~/.config/hypr/hyprlock.conf

shape {
    monitor = $lx_monitor
    size = 22%, 20%
    color = rgba($surface, 0.72)
    rounding = 20
    border_size = 1
    border_color = rgba($outline, 0.8)
    position = -3%, 20%
    halign = right
    valign = center
}

label {
    monitor = $lx_monitor
    text = cmd[update:3000] sh $lx_lynx/bin/lx lock info resources
    font_family = $lx_font
    font_size = 13
    text_align = left
    color = rgb($on_surface)
    position = -4.6%, 20%
    halign = right
    valign = center
    zindex = 1
}
