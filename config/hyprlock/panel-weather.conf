# LYNX :: lock screen panel — weather (left column, top)
#
# `lx lock info weather` answers instantly from a cache and refreshes that cache
# in the background at most every 30 minutes. A slow or offline network can
# never stall the lock screen: hyprlock waits for every label command to exit.
#
# Remove this panel: comment out its `source =` line in ~/.config/hypr/hyprlock.conf

shape {
    monitor = $lx_monitor
    size = 22%, 16%
    color = rgba($surface, 0.72)
    rounding = 20
    border_size = 1
    border_color = rgba($outline, 0.8)
    position = 3%, 25%
    halign = left
    valign = center
}

label {
    monitor = $lx_monitor
    text = cmd[update:60000] sh $lx_lynx/bin/lx lock info weather "$lx_weather_location"
    font_family = $lx_font
    font_size = 13
    text_align = left
    color = rgb($on_surface)
    position = 4.6%, 25%
    halign = left
    valign = center
    zindex = 1
}
