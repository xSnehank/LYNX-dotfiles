# LYNX :: fallback palette (kitty)
#
# Terminal colors until theming generates ~/.cache/lynx/colors-kitty.conf
# from your wallpaper. `lx theme ensure` copies this file there whenever it's
# missing, so the include line in your kitty.conf never points at nothing.
#
# The interface colors use the same palette roles, and the same values, as the
# other LYNX fallback palettes. The 16 terminal colors are Catppuccin Mocha's.

foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #89b4fa
cursor                  #89b4fa
cursor_text_color       #1e1e2e
url_color               #f9e2af
active_border_color     #89b4fa
inactive_border_color   #45475a
active_tab_foreground   #1e1e2e
active_tab_background   #89b4fa
inactive_tab_foreground #a6adc8
inactive_tab_background #313244

# black, red, green, yellow, blue, magenta, cyan, white -- then the bright set
