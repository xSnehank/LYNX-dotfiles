# ~/.config/hypr/hypridle.conf
#
# ╔════════════════════════════════════════════════════════════════════════╗
# ║  THIS FILE IS YOURS.                                                   ║
# ║  LYNX created it once and will never touch it again.                   ║
# ╚════════════════════════════════════════════════════════════════════════╝
#
# The lock/sleep wiring comes from LYNX (below). The timeouts are yours.
# Apply changes:   systemctl --user restart hypridle

source = ~/dotfiles/lynx/config/hypr/hypridle.conf

# ─── Timeouts ───────────────────────────────────────────────────────────────
# `timeout` is seconds without keyboard or mouse input. Apps that ask the
# system to stay awake (video players, browsers playing video) pause these.

# 4 min: dim the screen. Laptops only; it does nothing on a desktop monitor.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

# 5 min: lock. `idle` gives a 5-second grace period: move the mouse within 5
# seconds of the lock appearing and it goes away without a password. Locks
# triggered any other way (SUPER + ALT + L, before sleep) have no grace period.
listener {
    timeout = 300
    on-timeout = sh ~/dotfiles/lynx/bin/lx lock idle
}

# 6 min: screens off. Any input turns them back on.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspend. Off by default, because on a desktop that's often not
# what you want. Uncomment to enable; the machine locks before it sleeps.
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
