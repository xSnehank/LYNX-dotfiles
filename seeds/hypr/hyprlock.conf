# ~/.config/hypr/hyprlock.conf
#
# ╔════════════════════════════════════════════════════════════════════════╗
# ║  THIS FILE IS YOURS.                                                   ║
# ║  LYNX created it once and will never touch it again.                   ║
# ╚════════════════════════════════════════════════════════════════════════╝
#
# hyprlock reads this file top to bottom and swaps $variables in as plain text
# as it goes. So the ORDER of the sections below is the whole customization
# model:
#
#   1. palette   2. defaults   3. YOUR SETTINGS   4. layout   5. your widgets
#
# Whatever you set in section 3 is already in place when the layout reads it.
#
# A line with a mistake in it is skipped with a logged error; the lock screen
# still starts. Test changes safely with:   hyprlock --grace 60
# (you get 60 seconds to cancel it by moving the mouse).

# ─── 1. Palette ─────────────────────────────────────────────────────────────
source = ~/dotfiles/lynx/config/hyprlock/fallback-colors.conf
# Generated palette. `lx lock` keeps a copy of the fallback here until theming
# exists, so this line never points at a missing file.
source = ~/.cache/lynx/colors-hyprlock.conf

# ─── 2. Defaults ────────────────────────────────────────────────────────────
source = ~/dotfiles/lynx/config/hyprlock/defaults.conf
# Written by `lx lock` each time it locks: which monitor gets the side panels.
source = ~/.cache/lynx/lock-session.conf

# ─── 3. Your settings ───────────────────────────────────────────────────────
# Every knob, with its explanation: ~/dotfiles/lynx/config/hyprlock/defaults.conf
#
# $lx_weather_location = Berlin
# $lx_avatar = $HOME/Pictures/me.png
# $lx_fingerprint = false
# $lx_font_text = Inter

# ─── 4. Layout ──────────────────────────────────────────────────────────────
# Comment out a line to remove that part of the lock screen.
source = ~/dotfiles/lynx/config/hyprlock/core.conf
source = ~/dotfiles/lynx/config/hyprlock/background.conf
source = ~/dotfiles/lynx/config/hyprlock/center.conf
source = ~/dotfiles/lynx/config/hyprlock/panel-weather.conf
source = ~/dotfiles/lynx/config/hyprlock/panel-fetch.conf
source = ~/dotfiles/lynx/config/hyprlock/panel-media.conf
source = ~/dotfiles/lynx/config/hyprlock/panel-resources.conf
source = ~/dotfiles/lynx/config/hyprlock/panel-notifications.conf

# ─── 5. Your own widgets ────────────────────────────────────────────────────
# Anything added here is drawn on top of LYNX's. Widget reference:
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# label {
#     monitor =
#     text = Welcome back, $USER
#     font_size = 16
#     color = rgb($on_surface)
#     position = 0, 40%
#     halign = center
#     valign = center
# }
