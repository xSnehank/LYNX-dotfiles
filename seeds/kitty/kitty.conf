# ~/.config/kitty/kitty.conf
#
# ╔════════════════════════════════════════════════════════════════════════╗
# ║  THIS FILE IS YOURS.                                                   ║
# ║  LYNX created it once and will never touch it again.                   ║
# ╚════════════════════════════════════════════════════════════════════════╝
#
# Colors come from LYNX. They're regenerated from your wallpaper, and every
# open kitty window picks up the new ones straight away.

include ~/.cache/lynx/colors-kitty.conf

# ─── Your settings ──────────────────────────────────────────────────────────
# kitty keeps the last value it reads, so anything below overrides the colors
# above. Full reference: https://sw.kovidgoyal.net/kitty/conf/
#
# font_family         JetBrainsMono Nerd Font
# font_size           11.0
# background_opacity  0.95
# window_padding_width 6
